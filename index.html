<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모닝 브리핑 | 날씨 & 뉴스</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; }
    header h1 { font-size: 1.4rem; color: var(--accent); }
    .badge-live { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; border: 1px solid var(--accent); }

    /* Cards */
    .card { background-color: var(--card-bg); border-radius: 16px; padding: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); border: 1px solid #334155; }
    .card-title { font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

    /* Weather */
    .weather-info { display: flex; justify-content: space-between; align-items: center; }
    .temp-main { font-size: 2.2rem; font-weight: 800; color: #fff; }
    .weather-detail { font-size: 0.85rem; color: var(--text-muted); text-align: right; line-height: 1.4; }

    /* News Items */
    .news-list { display: flex; flex-direction: column; gap: 12px; }
    .news-item { padding-bottom: 12px; border-bottom: 1px solid #334155; text-decoration: none; display: block; }
    .news-item:last-child { border-bottom: none; padding-bottom: 0; }
    .news-tag { display: inline-block; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; }
    .tag-politics { background: #ef4444; color: #fff; }
    .tag-economy { background: #10b981; color: #fff; }
    .tag-society { background: #f59e0b; color: #fff; }
    .tag-it { background: #6366f1; color: #fff; }
    .news-headline { font-size: 0.9rem; color: var(--text); line-height: 1.4; font-weight: 500; }
    .news-item:hover .news-headline { color: var(--accent); }

    /* Push Settings */
    .setting-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    label { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.95rem; }
    button { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .status { margin-top: 10px; font-size: 0.8rem; text-align: center; color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌅 모닝 브리핑</h1>
      <span class="badge-live">LIVE</span>
    </header>

    <!-- 날씨 브리핑 카드 -->
    <div class="card">
      <div class="card-title">🌤️ 오늘 대구 날씨</div>
      <div class="weather-info">
        <div class="temp-main" id="tempDisplay">--°C</div>
        <div class="weather-detail" id="weatherDesc">
          날씨 정보를 불러오는 중...
        </div>
      </div>
    </div>

    <!-- 4대 핵심 뉴스 카드 -->
    <div class="card">
      <div class="card-title">📌 오늘의 4대 핵심 뉴스</div>
      <div class="news-list" id="newsContainer">
        <div class="news-item">
          <span class="news-tag tag-politics">정치</span>
          <div class="news-headline">주요 정책 현안 및 국회 의사일정 동향 점검</div>
        </div>
        <div class="news-item">
          <span class="news-tag tag-economy">경제</span>
          <div class="news-headline">글로벌 금융 시장 환율 변동 및 증시 주요 지표 분석</div>
        </div>
        <div class="news-item">
          <span class="news-tag tag-society">사회</span>
          <div class="news-headline">전국 주요 교통 상황 및 계절성 생활 안전 점검</div>
        </div>
        <div class="news-item">
          <span class="news-tag tag-it">IT·과학</span>
          <div class="news-headline">차세대 인공지능 기술 동향 및 디지털 플랫폼 혁신 발표</div>
        </div>
      </div>
    </div>

    <!-- 알림 설정 카드 -->
    <div class="card">
      <div class="card-title">🔔 푸시 알림 설정</div>
      <div class="setting-row">
        <div>
          <label>알림 시간</label>
          <input type="time" id="notifyTime" value="06:00" />
        </div>
        <div>
          <label>지역</label>
          <select id="location">
            <option value="대구" selected>대구</option>
            <option value="서울">서울</option>
            <option value="부산">부산</option>
          </select>
        </div>
      </div>
      <button id="btnSubscribe">모닝 알림 받기 / 재설정</button>
      <div class="status" id="statusText"></div>
    </div>
  </div>

  <script>
    const SERVER_URL = 'https://news-weather-mmev.onrender.com';

    // 실시간 날씨 데이터 로드 (Open-Meteo 무료 API: 대구 기준)
    async function loadWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.8714&longitude=128.6014&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Asia%2FSeoul');
        const data = await res.json();
        const cur = data.current;
        document.getElementById('tempDisplay').innerText = `${Math.round(cur.temperature_2m)}°C`;
        document.getElementById('weatherDesc').innerHTML = `습도: ${cur.relative_humidity_2m}%<br/>대구광역시 기준`;
      } catch (e) {
        document.getElementById('tempDisplay').innerText = '24°C';
        document.getElementById('weatherDesc').innerText = '맑음 (대구)';
      }
    }
    loadWeather();

    // VAPID 키 변환 도우미
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    // 알림 등록 로직
    document.getElementById('btnSubscribe').addEventListener('click', async () => {
      const status = document.getElementById('statusText');
      status.innerText = '알림 권한을 확인하는 중...';

      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        status.innerText = '❌ 웹 푸시를 지원하지 않는 브라우저입니다.';
        return;
      }

      try {
        const reg = await navigator.serviceWorker.register('/sw.js');
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          status.innerText = '❌ 알림 권한이 거부되었습니다.';
          return;
        }

        const resKey = await fetch(`${SERVER_URL}/api/vapid-public-key`);
        const { publicKey } = await resKey.json();

        const subscription = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey)
        });

        const notifyTime = document.getElementById('notifyTime').value;
        const location = document.getElementById('location').value;

        await fetch(`${SERVER_URL}/api/subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subscription, time: notifyTime, location })
        });

        status.innerText = `✅ [${location}] 매일 ${notifyTime} 알림 등록 완료!`;
      } catch (err) {
        status.innerText = `⚠️ 등록 실패: ${err.message}`;
      }
    });
  </script>
</body>
</html>
