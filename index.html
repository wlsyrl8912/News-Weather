<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모닝 브리핑 (날씨 & 뉴스)</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; max-width: 450px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .setting-box { margin: 20px 0; background: #0f172a; padding: 16px; border-radius: 12px; }
    label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 1rem; margin-bottom: 12px; }
    button { width: 100%; padding: 14px; background: #0284c7; color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .status { margin-top: 14px; font-size: 0.85rem; text-align: center; color: #38bdf8; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌅 모닝 브리핑</h1>
    <p>매일 아침 날씨와 핵심 뉴스를 스마트폰 상단바 푸시 알림으로 받아보세요.</p>
    
    <div class="setting-box">
      <label>알림 받을 시간</label>
      <input type="time" id="notifyTime" value="06:00" />
      
      <label>지역 선택</label>
      <select id="location">
        <option value="대구">대구</option>
        <option value="서울">서울</option>
        <option value="부산">부산</option>
        <option value="인천">인천</option>
        <option value="대전">대전</option>
        <option value="광주">광주</option>
      </select>
    </div>

    <button id="btnSubscribe">🔔 모닝 알림 등록하기</button>
    <div class="status" id="statusText"></div>
  </div>

  <script>
    const SERVER_URL = 'https://news-weather-mmev.onrender.com';

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    document.getElementById('btnSubscribe').addEventListener('click', async () => {
      const status = document.getElementById('statusText');
      status.innerText = '알림 권한을 확인하는 중...';

      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        status.innerText = '❌ 이 브라우저는 웹 푸시를 지원하지 않습니다.';
        return;
      }

      try {
        const reg = await navigator.serviceWorker.register('/sw.js');
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          status.innerText = '❌ 알림 권한이 거부되었습니다.';
          return;
        }

        const resKey = await fetch(`${SERVER_URL}/api/vapid-public-key`);
        const { publicKey } = await resKey.json();

        const subscription = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey)
        });

        const notifyTime = document.getElementById('notifyTime').value;
        const location = document.getElementById('location').value;

        await fetch(`${SERVER_URL}/api/subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subscription, time: notifyTime, location })
        });

        status.innerText = `✅ [${location}] 매일 ${notifyTime} 모닝 브리핑 등록 완료!`;
      } catch (err) {
        status.innerText = `⚠️ 등록 실패: ${err.message}`;
      }
    });
  </script>
</body>
</html>
